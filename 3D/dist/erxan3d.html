<title>Erxan Mebel 3D</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Unbounded:wght@600&display=swap">
<style>
/* Layout: full-bleed 3D viewport; tool sheet docks right on wide screens, slides up from the bottom on phones. */
:root {
  --bg: #e6e9e4;         /* scene + page ground, sage-tinted grey */
  --surface: #f8f9f6;    /* panels */
  --surface-2: #eef1ec;  /* inputs, chips */
  --ink: #1b221e;
  --muted: #5d6862;
  --line: #cfd6cf;
  --accent: #2448a8;     /* blueprint blue: dimension lines, selection, actions */
  --accent-ink: #ffffff;
  --danger: #b3261e;
  --shadow: 0 8px 28px rgba(20, 30, 25, .14);
  --f-display: "Unbounded", "Inter", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161a18; --surface: #1e2320; --surface-2: #262c28; --ink: #e5eae5; --muted: #9aa59e;
    --line: #333b36; --accent: #86a6ff; --accent-ink: #0d1530; --danger: #ff8a80;
    --shadow: 0 8px 28px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161a18; --surface: #1e2320; --surface-2: #262c28; --ink: #e5eae5; --muted: #9aa59e;
  --line: #333b36; --accent: #86a6ff; --accent-ink: #0d1530; --danger: #ff8a80;
  --shadow: 0 8px 28px rgba(0, 0, 0, .45); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 14px/1.4 var(--f-body);
  overflow: hidden; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr; }

/* top bar */
.topbar {
  display: flex; align-items: center; gap: 8px; z-index: 5;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { font: 600 13px/1 var(--f-display); letter-spacing: .02em; white-space: nowrap; }
.brand b { color: var(--accent); font-weight: 600; }
.spacer { flex: 1; }
.seg { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button {
  border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--muted);
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.icon-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px; height: 34px; min-width: 34px;
  padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 500;
}
.icon-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.icon-btn svg { width: 18px; height: 18px; }

/* stage */
.stage { position: relative; min-height: 0; display: grid; grid-template-columns: 1fr; }
#viewport { position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; }
#viewport canvas { display: block; width: 100%; height: 100%; }
#labels { position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
.dim {
  font: 600 12px/1 var(--f-mono); color: var(--accent); background: var(--surface);
  border: 1px solid var(--accent); border-radius: 6px; padding: 3px 6px; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.dim.room { background: var(--accent); color: var(--accent-ink); }
.dim.small { font-size: 11px; padding: 2px 5px; border-color: var(--line); color: var(--ink); }

/* selection bar */
.selbar {
  position: absolute; left: 50%; transform: translateX(-50%); top: 10px; z-index: 4;
  display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 14px;
  background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); max-width: calc(100% - 20px);
}
.selbar .name { font-weight: 600; font-size: 13px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.selbar .danger { color: var(--danger); }

/* hint */
.hint {
  position: absolute; left: 12px; bottom: 12px; z-index: 3; font-size: 12px; color: var(--muted);
  background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 6px 10px; border-radius: 8px; max-width: 60%;
}

/* sheet */
.sheet {
  background: var(--surface); display: flex; flex-direction: column; min-height: 0; z-index: 6;
}
.tabs { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid var(--line); }
.tabs button {
  flex: 1; border: 0; background: transparent; border-radius: 10px; padding: 8px 6px; font-weight: 600; font-size: 13px; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.tabs button svg { width: 20px; height: 20px; }
.tabs button[aria-selected="true"] { background: var(--surface-2); color: var(--accent); }
.sheet-body { overflow-y: auto; padding: 14px 16px 20px; display: grid; gap: 16px; align-content: start; min-height: 0; }
.sheet h3 { margin: 0; font: 600 12px/1.2 var(--f-display); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.group { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.row.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); }
.num {
  display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); overflow: hidden;
}
.num input {
  width: 100%; min-width: 0; border: 0; background: transparent; padding: 9px 4px 9px 10px;
  font: 600 15px/1 var(--f-mono); font-variant-numeric: tabular-nums;
}
.num input:focus { outline: none; }
.num:focus-within { border-color: var(--accent); }
.num span { font-size: 11px; color: var(--muted); padding-right: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch {
  width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); padding: 0; position: relative;
}
.swatch[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.swatch.picker { display: grid; place-items: center; overflow: hidden; cursor: pointer; }
.swatch.picker input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.swatch.picker span { font-weight: 700; color: #fff; text-shadow: 0 0 3px rgba(0,0,0,.6); pointer-events: none; }
.patterns { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.pat {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 6px 4px;
  display: grid; justify-items: center; gap: 4px; font-size: 11px; font-weight: 500; min-width: 0;
}
.pat img { width: 42px; height: 56px; border-radius: 3px; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.pat span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.pat[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); color: var(--accent); }
.toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

.catalog { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px; text-align: left;
  display: grid; gap: 6px; align-content: start;
}
.card:active { transform: scale(.98); }
.card svg { width: 100%; height: 64px; color: var(--ink); }
.card strong { font-size: 13px; }
.card small { color: var(--muted); font: 500 11px/1.2 var(--f-mono); }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.btn {
  border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: 10px 14px; font-weight: 600;
}
.btn.ghost { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }

/* wide screens: sheet docked on the right */
@media (min-width: 860px) {
  .stage { grid-template-columns: 1fr 360px; }
  .sheet { border-left: 1px solid var(--line); }
  .sheet .grip { display: none; }
}
/* phones and portrait tablets: bottom sheet */
@media (max-width: 859px) {
  .stage { display: block; }
  #viewport { position: absolute; inset: 0; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; max-height: 52%; border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  }
  .sheet.collapsed .sheet-body { display: none; }
  .grip { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 6px auto 0; }
  .hint { bottom: auto; top: 10px; max-width: calc(100% - 24px); }
  .brand span { display: none; }
}
@media (max-width: 420px) {
  .seg button { padding: 6px 7px; }
  .icon-btn .lbl { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app">
  <header class="topbar">
    <div class="brand">ERXAN <b>3D</b><span> · жиһаз сызбасы</span></div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Көрініс">
      <button id="view3d" aria-pressed="true">3D</button>
      <button id="viewFront" aria-pressed="false">Алды</button>
      <button id="viewTop" aria-pressed="false">Үсті</button>
    </div>
    <button class="icon-btn" id="dimsBtn" aria-pressed="true" title="Өлшемдер">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8v8M21 8v8M3 12h18M7 9l-4 3 4 3M17 9l4 3-4 3"/></svg>
      <span class="lbl">Өлшем</span>
    </button>
  </header>

  <div class="stage">
    <div id="viewport">
      <div id="labels"></div>
      <div class="selbar" id="selbar" hidden>
        <span class="name" id="selName"></span>
        <button class="icon-btn" id="rotBtn" title="90° бұру">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/></svg>
        </button>
        <button class="icon-btn" id="dupBtn" title="Көшірме">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>
        </button>
        <button class="icon-btn danger" id="delBtn" title="Жою">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
        </button>
      </div>
      <div class="hint" id="hint">Бір саусақпен айналдыр, екі саусақпен үлкейт. Шкафты басып, сүйреп жылжыт.</div>
    </div>

    <aside class="sheet" id="sheet">
      <div class="grip"></div>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="room" aria-selected="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 20V8l9-4 9 4v12M3 20h18M9 20v-6h6v6"/></svg>Бөлме
        </button>
        <button role="tab" data-tab="catalog" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M12 4v16M9.5 11v2M14.5 11v2"/></svg>Шкафтар
        </button>
        <button role="tab" data-tab="props" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Баптау
        </button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </aside>
  </div>
</div>

<div id="bootError" hidden style="position:fixed;inset:auto 12px 12px 12px;z-index:99;background:#b3261e;color:#fff;padding:10px 12px;border-radius:10px;font:13px/1.4 system-ui"></div>
<script>
  // Бағдарлама іске қоспаса, қатені экранда көрсету (телефонда консоль жоқ)
  window.addEventListener('error', function (e) {
    var b = document.getElementById('bootError');
    b.hidden = false;
    b.textContent = 'Қате: ' + (e.message || e) + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
  });
</script>
