<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #141414; }
      #root { position: relative; width: 100%; height: 100%; }
      #bg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #face-ring { position: absolute; left: 50px; top: 1220px; width: 430px; height: 430px; border-radius: 50%;
        border: 10px solid #d9825b; overflow: hidden; background: #141414; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
      #face { position: absolute; left: 0; top: 0; width: 410px; height: 410px; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22.53" data-width="1080" data-height="1920">
      <video id="bg" class="clip" src="assets/video/bg.mp4" data-start="0" data-duration="19.43" data-track-index="0" muted playsinline style="z-index:1"></video>
      <div id="face-ring" style="z-index:10">
        <video id="face" class="clip" src="assets/video/me.mp4" data-start="0" data-duration="19.53" data-track-index="1" data-has-audio="true" data-volume="1" playsinline></video>
      </div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="19.53" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:20"></div>
      <div id="cards" data-composition-id="cards" data-composition-src="compositions/cards.html" data-start="0" data-duration="19.53" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:21"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="19.53" data-duration="3.0" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:30"></div>
      <audio id="sfx" class="clip" src="assets/sfx.wav" data-start="0" data-duration="22.53" data-track-index="5" data-volume="0.3"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#face-ring", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(1.8)" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
